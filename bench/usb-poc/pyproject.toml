[project]
name = "edth-usb-bench"
version = "0.1.0"
description = "Local XIAO USB camera bring-up and motion observation bench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=2,<3",
  "opencv-python-headless>=4.10,<6", "pyserial==3.5",
]

[project.scripts]
skywatch = "skywatch.cli:main"
skywatch-calibrate = "skywatch.calibrate:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.6", "playwright>=1.50,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skywatch"]

# Independent bench workspace: this project does not join the gateway services.
[tool.uv.workspace]
members = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
