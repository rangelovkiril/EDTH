[project]
name = "tr-tools"
version = "0.1.0"
description = "Replay, simulator, calibration, status CLI"
requires-python = ">=3.11"
dependencies = ["trwire", "tr-bridge", "tr-fusion", "numpy", "opencv-python-headless", "paho-mqtt>=2.1", "pyyaml"]

[project.scripts]
tr-replay = "tr_tools.replay:main"
tr-sim = "tr_tools.sim:main"
tr-calib = "tr_tools.calib:main"
trctl = "tr_tools.trctl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tr_tools"]

[tool.uv.sources]
trwire = { workspace = true }
tr-bridge = { workspace = true }
tr-fusion = { workspace = true }
