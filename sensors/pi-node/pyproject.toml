[project]
name = "tr-pi-node"
version = "0.1.0"
description = "Raspberry Pi camera sensor node"
requires-python = ">=3.11"
dependencies = ["trwire", "numpy"]

[project.scripts]
tr-pi-node = "tr_pi_node.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tr_pi_node"]

[tool.uv.sources]
trwire = { workspace = true }
