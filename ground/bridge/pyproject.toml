[project]
name = "tr-bridge"
version = "0.1.0"
description = "Ground ESP to MQTT bridge and raw recorder"
requires-python = ">=3.11"
dependencies = ["trwire", "paho-mqtt>=2.1"]

[project.scripts]
tr-bridge = "tr_bridge.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tr_bridge"]

[tool.uv.sources]
trwire = { workspace = true }
