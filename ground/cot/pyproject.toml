[project]
name = "tr-cot"
version = "0.1.0"
description = "Tracks to Cursor on Target"
requires-python = ">=3.11"
dependencies = ["paho-mqtt>=2.1", "pyyaml"]

[project.scripts]
tr-cot = "tr_cot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tr_cot"]
