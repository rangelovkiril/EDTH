[project]
name = "tr-fusion"
version = "0.1.0"
description = "Triangulation, tracking and affiliation"
requires-python = ">=3.11"
dependencies = ["numpy", "opencv-python-headless", "paho-mqtt>=2.1", "pyyaml"]

[project.scripts]
tr-fusion = "tr_fusion.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tr_fusion"]
