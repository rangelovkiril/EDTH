# Copy to secrets.yaml (gitignored), fill in, then: kubectl apply -f secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: edth-emqx-secrets
type: Opaque
stringData:
  # Plain passwords; EMQX hashes them on import. One row per MQTT user.
  # Node usernames must equal NODE_ID (the ACL ties publishing to the clientid).
  users.csv: |
    user_id,password,is_superuser
    rpi-1,CHANGE-ME,false
    rpi-2,CHANGE-ME,false
    viewer,CHANGE-ME,false
  pg_password: CHANGE-ME
  # CA certificate of the Exoscale DBaaS Postgres (download from the DBaaS console).
  pg-ca.pem: |
    -----BEGIN CERTIFICATE-----
    CHANGE-ME
    -----END CERTIFICATE-----
  dashboard_password: CHANGE-ME
  # Needed for a multi-node cluster (EMQX >= 5.9). Remove the line to run unlicensed.
  license_key: CHANGE-ME
