%% Nodes publish only under nodes/<own clientid>/ (clientid == NODE_ID == username).
{allow, {username, {re, "^dashboard$"}}, subscribe, ["$SYS/#"]}.
{allow, all, publish, ["nodes/${clientid}/#"]}.
%% Read-only consumers (teammates, demo screens).
{allow, {username, "viewer"}, subscribe, ["detections/#", "nodes/#"]}.
{deny, all}.
