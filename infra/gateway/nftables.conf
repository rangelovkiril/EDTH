#!/usr/sbin/nft -f
# Triangulum gateway firewall (docs/network.md). NetworkManager adds its own NAT rules.
table inet tr_filter
delete table inet tr_filter
table inet tr_filter {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    iif lo accept
    meta l4proto { icmp, ipv6-icmp } accept
    iifname "eth0" tcp dport { 22, 1883 } accept
    iifname "eth0" udp dport 123 accept
    iifname "wlan0" udp dport { 53, 67, 123, 5600, 5601 } accept
  }
}
