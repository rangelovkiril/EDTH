[project]
name = "tr-ingest"
version = "0.1.0"
description = "UDP ingest to MQTT, raw recorder, TSYNC responder"
requires-python = ">=3.11"
dependencies = ["trwire", "paho-mqtt>=2.1"]

[project.scripts]
tr-ingest = "tr_ingest.main:main"
tr-tsyncd = "tr_ingest.tsyncd:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tr_ingest"]

[tool.uv.sources]
trwire = { workspace = true }
