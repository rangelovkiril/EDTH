name: fusion

on:
  push:
    branches: [main]
    paths: ["fusion/**", "docs/**", ".github/workflows/fusion.yml"]
  pull_request:
    paths: ["fusion/**", "docs/**", ".github/workflows/fusion.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/edth-fusion

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: fusion
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Only wheels are installed, so building arm64 under QEMU is quick.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: fusion
          platforms: linux/amd64,linux/arm64
          build-args: GIT_SHA=${{ github.sha }}
          provenance: false
          sbom: false
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=fusion
          cache-to: type=gha,mode=max,scope=fusion
