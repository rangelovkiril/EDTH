name: node

on:
  push:
    branches: [main]
    paths: ["node/**", "docs/**", "deploy/**", ".github/workflows/node.yml"]
  pull_request:
    paths: ["node/**", "docs/**", "deploy/**", ".github/workflows/node.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/edth-node

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: shellcheck ../deploy/bootstrap.sh

  # The Pi pulls :latest itself (podman auto-update), so this job is the whole deploy.
  build:
    needs: test
    if: github.event_name != 'pull_request'
    # Native arm64 runner (free for public repos); OpenCV/numpy under QEMU is very slow.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: node
          platforms: linux/arm64
          build-args: GIT_SHA=${{ github.sha }}
          provenance: false
          sbom: false
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
