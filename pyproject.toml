[tool.uv.workspace]
members = [
  "protocol/python",
  "gateway/ingest",
  "sensors/pi-node",
  "ground/fusion",
  "ground/cot",
  "tools",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
